{% comment %}
  Single image with optional caption.
  Usage:
    {% include figure.html src="/images/2026-berlin-marathon/hero.jpg" alt="Describe the photo" caption="Optional caption" %}
  Optional: class="wide" (bleeds wider than the text column on big screens)
{% endcomment %}
<figure class="post-figure {{ include.class }}">
  <img src="{{ include.src | relative_url }}" alt="{{ include.alt | default: include.caption | escape }}" loading="lazy">
  {% if include.caption %}<figcaption>{{ include.caption | markdownify | remove: '<p>' | remove: '</p>' }}</figcaption>{% endif %}
</figure>
